name: Validar Nexo Centro e interfaz WPF
on:
  push:
    branches: [entrega-diagnostico-agendaclara-20261105]
    paths:
      - '.github/workflows/nexo-centro-ui.yml'
      - 'entregas/nexo-centro-4.0.4-ui-r1/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexo-centro-ui-r1
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Obtener entrega sin conservar credenciales Git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Ejecutar ocho baterías Windows aisladas
        id: pruebas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:GITHUB_WORKSPACE 'entregas/nexo-centro-4.0.4-ui-r1'
          $archive=Join-Path $folder 'NexoCentro-4.0.4-interfaz-r1.zip'
          $expected=((Get-Content -LiteralPath (Join-Path $folder 'SHA256SUMS.txt')) -split '  ',2)[0]
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash-ne$expected){throw 'La entrega no coincide con su huella.'}
          $destination=Join-Path $env:RUNNER_TEMP ('NexoCentro-Entrega-'+[Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $release=Join-Path $destination 'NexoCentro-4.0.4-interfaz-r1'
          $results=Join-Path $env:RUNNER_TEMP 'NexoCentro-Resultados'
          New-Item -ItemType Directory -Force -Path $results|Out-Null
          Copy-Item -LiteralPath (Join-Path $release 'compilacion.json') -Destination (Join-Path $results 'compilacion-probada.json')
          & (Join-Path $release 'Pruebas/Validar-NexoCentro.ps1') -Entrega $release -Resultados $results
      - name: Conservar sólo informes y registros de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resultados-nexo-centro-ui-r1
          path: |
            ${{ runner.temp }}/NexoCentro-Resultados/*.txt
            ${{ runner.temp }}/NexoCentro-Resultados/*.json
            ${{ runner.temp }}/NexoCentro-Resultados/datos-interfaz/interfaz/*.png
            ${{ runner.temp }}/NexoCentro-Resultados/datos-interfaz/resultado-pruebas.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Resumir resultado
        if: always()
        shell: pwsh
        run: |
          $result='${{ steps.pruebas.outcome }}'
          "## Nexo Centro: interfaz y compatibilidad`nResultado de la etapa de pruebas: **$result**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $file=Join-Path $env:RUNNER_TEMP 'NexoCentro-Resultados/baterias.json'
          if(Test-Path -LiteralPath $file){Get-Content -LiteralPath $file -Raw|Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append}
