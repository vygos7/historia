name: Validar desarrollo Google OAuth Nexo Centro
on:
  push:
    branches: [nexo-centro-google-oauth-desarrollo]
    paths:
      - '.github/workflows/nexo-centro-google-oauth.yml'
      - 'entregas/nexo-centro-google-oauth-desarrollo/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Obtener fuentes sin conservar credenciales
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Validar fuentes e interfaz con datos ficticios
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $folder=Join-Path $env:GITHUB_WORKSPACE 'entregas/nexo-centro-google-oauth-desarrollo'
          $zip=Join-Path $folder 'FUENTES-DESARROLLO-NO-INSTALAR.zip'
          $expected=((Get-Content (Join-Path $folder 'SHA256SUMS.txt'))-split'  ',2)[0]
          if((Get-FileHash $zip -Algorithm SHA256).Hash-ne$expected){throw 'La fuente no coincide con su huella.'}
          $base=Join-Path $env:RUNNER_TEMP 'NexoCentroExperimentalGoogleOAuth-Validacion'
          New-Item -ItemType Directory -Force -Path $base|Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $base
          $source=Join-Path $base 'NexoCentroExperimentalGoogleOAuth-Fuentes'
          $results=Join-Path $env:RUNNER_TEMP 'GoogleOAuth-Resultados'
          New-Item -ItemType Directory -Force -Path $results|Out-Null
          function Check([string]$name,[scriptblock]$action){
            $log=Join-Path $results ($name+'.txt')
            & $action *> $log
            if($LASTEXITCODE-ne0){
              $message=((Get-Content $log|Select-Object -Last 10)-join' | ').Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::error title=GoogleOAuth-${name}::$message"
              throw "Fallo: $name"
            }
            $summary=(Select-String -LiteralPath $log -Pattern 'RESUMEN:'|Select-Object -Last 1).Line
            if($summary){Write-Host "::notice title=GoogleOAuth-${name}::$summary"}
          }
          Check 'compilar-interfaz' {dotnet build (Join-Path $source 'aplicacion/pruebas-google-ui/Nexo.Google.UI.Pruebas.csproj') -c Release}
          Check 'interfaz-principiantes' {& (Join-Path $source 'aplicacion/pruebas-google-ui/bin/Release/net48/AgendaClara.Pruebas.exe')}
          Check 'oficial' {dotnet run --project (Join-Path $source 'aplicacion/pruebas-google-oficial/Nexo.Google.Oficial.Pruebas.csproj') -c Release}
          Check 'gestor' {dotnet run --project (Join-Path $source 'aplicacion/pruebas-google/Nexo.Google.Pruebas.csproj') -c Release}
          Check 'datos' {dotnet run --project (Join-Path $source 'aplicacion/pruebas-core/Nexo.Core.Pruebas.csproj') -c Release}
          Check 'transporte' {dotnet run --project (Join-Path $source 'aplicacion/pruebas-transporte/AgendaClara.TransportTests.csproj') -c Release -- (Join-Path $base 'transporte')}
          Check 'sesiones' {dotnet run --project (Join-Path $source 'aplicacion/pruebas-sesion/AgendaClara.SessionTests.csproj') -c Release -- (Join-Path $base 'sesiones')}
          Check 'compilar-regresion-wpf' {dotnet build (Join-Path $source 'aplicacion/pruebas-locales.csproj') -c Release}
          Check 'regresion-wpf' {& (Join-Path $source 'aplicacion/bin/Release/net48/AgendaClara.Pruebas.exe') (Join-Path $base 'regresion-wpf')}
          Get-ChildItem -Path (Join-Path $env:TEMP 'NexoCentroExperimentalGoogleOAuth/ui-*/asistente-google.png') -ErrorAction SilentlyContinue|Copy-Item -Destination $results
          Write-Host '::notice title=GoogleOAuth-Estado::Validacion Windows terminada. Google real pendiente de registro de aplicacion. No es un instalador listo para distribuir.'
      - name: Conservar registros de pruebas y captura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: google-oauth-desarrollo-resultados
          path: ${{ runner.temp }}/GoogleOAuth-Resultados
          retention-days: 14
          if-no-files-found: warn
